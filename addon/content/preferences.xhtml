<groupbox xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
          xmlns:html="http://www.w3.org/1999/xhtml"
          id="wordsync-maimemo-preferences"
          onload="event.waitUntil(Zotero.WordSyncMaimemo.mountPreferences(this))">
  <html:section class="wordsync-settings main-section">
    <html:p>在阅读器中划选单词，确认后加入墨墨背单词。设置改动即时生效，不用手动保存。</html:p>

    <html:label class="wordsync-field" for="wordsync-token">墨墨开放 API Token</html:label>
    <html:div class="wordsync-row">
      <html:input id="wordsync-token" data-wordsync="token" type="text" autocomplete="off" spellcheck="false" />
      <html:button data-wordsync="test" type="button">测试连接</html:button>
    </html:div>
    <html:p class="wordsync-secondary wordsync-line" data-wordsync="test-result" role="status" aria-live="polite" />
    <html:p class="wordsync-secondary">获取方式：墨墨 App → 我的 → 更多设置 → 实验功能 → 开放 API。</html:p>

    <html:h2>云词本</html:h2>
    <html:label class="wordsync-field" for="wordsync-new-notepad">新建云词本（新建的词本默认不发布，仅自己可见）</html:label>
    <html:div class="wordsync-row">
      <html:input id="wordsync-new-notepad" data-wordsync="notepad-new-title" type="text" spellcheck="false" />
      <html:button data-wordsync="notepad-create" type="button">新建</html:button>
    </html:div>
    <html:div class="wordsync-row">
      <html:select data-wordsync="notepad-list" class="wordsync-select" />
      <html:span class="wordsync-chosen-mark" data-wordsync="notepad-chosen" hidden="hidden">已选择</html:span>
      <html:button data-wordsync="notepad-select" type="button">使用所选词本</html:button>
    </html:div>

    <html:h2>其他</html:h2>
    <html:label class="wordsync-checkbox">
      <html:input data-wordsync="study-plan" type="checkbox" />
      自动加入墨墨学习计划
    </html:label>
    <html:p class="wordsync-secondary">开关适用于之后加入的单词。学习计划联动需要在墨墨 App 中开启自动同步。</html:p>
    <html:div class="wordsync-buttons">
      <html:button data-wordsync="clear" type="button">清除 Token</html:button>
    </html:div>
    <html:p class="wordsync-message wordsync-line" data-wordsync="message" role="status" aria-live="polite" />

    <html:h2>同步状态</html:h2>
    <html:p class="wordsync-line" data-wordsync="worker-status" role="status" aria-live="polite" />
    <html:p class="wordsync-line" data-wordsync="counts" />
    <html:div class="wordsync-buttons">
      <html:button data-wordsync="retry" type="button">重试未完成的单词</html:button>
    </html:div>
    <html:p class="wordsync-secondary">以下显示最近 50 条加入记录。</html:p>
    <html:ul data-wordsync="records" class="wordsync-records" />
  </html:section>
</groupbox>
